name: CI/CD Pipeline2


on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout du code
      uses: actions/checkout@v3

    - name: Installer Python
      uses: actions/setup-python@v4
      with:
        python-version:  '3.9'

    - name: Installer les dependances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Lancer les tests
      run: |
        pytest

    - name: Build de l'image Docker
      run: |
        docker build -t mon-app:${{ github.sha }} .

    - name: Déploiement (simulation)
      run: |
        echo "Deploiement simulé de l'app version ${{ github.sha }}"
    
    - name: Login Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secret.DOCKER_USERNAME }}
        password: ${{ secret.DOCKER_PASSWORD }}

    - name: Push image Docker
      run: |
        docker tag mon-app:${{ github.sha }}
    monutilisateur/mon-app:latest
        docker push monutilisateur/mon-app:latest 
